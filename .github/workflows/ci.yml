name: CI

# Fast, cross-platform continuous integration that runs on every push and pull
# request (including feature branches). It complements the Windows-only
# "Build Data Center CoreCLR" workflow by running the unit tests, which do not
# require Unity or IL2CPP assemblies.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/UnityExplorer.Tests/UnityExplorer.Tests.csproj

      - name: Test
        run: dotnet test tests/UnityExplorer.Tests/UnityExplorer.Tests.csproj --configuration Release --no-restore --verbosity normal
